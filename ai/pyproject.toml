[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualtryon-ai"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime deps intentionally not declared here — this package is only ever
# installed alongside backend/requirements.txt (which already provides
# Pillow/pydantic) or ai/requirements.txt (the heavier ML deps, for ai/'s
# own service). Duplicating version pins across two requirements sources
# risks drift, not safety; this package is metadata + package discovery
# only, letting `src` (this project's existing top-level package name —
# see known_first_party below) be installed as a real, importable
# distribution instead of resolved via a runtime sys.path hack.

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
