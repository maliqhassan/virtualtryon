# Checks every push to main and every pull request into it (ADR 0017).
# CI only: Render deploys on its own; set its auto-deploy to wait for these
# checks ("After CI checks pass") to stop a red build from going live.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request replaces its run still in progress. Runs
# on main are never cancelled: every commit there gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: virtualtryon
          POSTGRES_PASSWORD: virtualtryon
          POSTGRES_DB: virtualtryon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U virtualtryon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # A throwaway database in this job only; not a real credential.
      DATABASE_URL: postgresql+asyncpg://virtualtryon:virtualtryon@localhost:5432/virtualtryon
      SECRET_KEY: ci-only-key-used-nowhere-else-0123456789abcdef
      APP_ENV: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The version the production image runs (backend/Dockerfile).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            ai/pyproject.toml
      - name: System libraries
        # OpenCV/MediaPipe load these at import time, even "headless"
        # (the same apt line as backend/Dockerfile's runtime image).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        # ../ai is the shared try-on package, installed as the Docker image does.
        run: pip install -r requirements-dev.txt ../ai
      - name: Lint
        run: |
          ruff check app tests
          black --check app tests
      - name: Apply migrations
        # The hand-written migrations, on real Postgres, as start.sh runs them.
        run: alembic upgrade head
      - name: Tests
        # test_mediapipe_analyze downloads MediaPipe's model from Google on
        # first use; left out so a slow download can't fail the build.
        run: pytest -q --ignore=tests/test_mediapipe_analyze.py

  app:
    name: App (typecheck, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
