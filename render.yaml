# Render Blueprint: the backend API (plus its try-on worker) and Postgres.
# Set up in the Render dashboard with New > Blueprint > this repository.
# See docs/setup/deploy-render.md and docs/decisions/0009-render-hosting.md.
services:
  - type: web
    name: virtualtryon-api
    runtime: docker
    # The Dockerfile needs the repo root as context so it can install ai/.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh ./start.sh
    region: frankfurt
    # Starter, not free: free web services can't have a disk, so every
    # uploaded photo would vanish on each restart, and 512 MB is tight
    # for MediaPipe.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /app/storage/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: virtualtryon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # vton_d: real try-ons through RapidAPI for testing (ADR 0013), needs
      # TRYON_API_KEY. demo: a labelled placeholder, no AI.
      - key: TRYON_PROVIDER
        value: vton_d
      # Secret: the RapidAPI key, pasted in Render's dashboard.
      - key: TRYON_API_KEY
        sync: false
      # Try-ons all users together can start in a day (VTON-D's free plan
      # is 100 a month). Required while TRYON_LIMITS_ENABLED is false.
      - key: TRYON_DAILY_LIMIT
        value: "10"
      # Off while testing (no 1-free-try-on limit). Set to "true" before launch.
      - key: TRYON_LIMITS_ENABLED
        value: "false"
      - key: FULL_BODY_CHECK_ENABLED
        value: "true"
      - key: BACKGROUND_REMOVAL_ENABLED
        value: "true"
      # Google sign-in (ADR 0012): the Firebase project id, set in the
      # dashboard once the Firebase project exists. Empty turns it off.
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Category guess for new wardrobe pieces (api4.ai via RapidAPI). Secret:
      # paste the key in Render's dashboard; empty turns detection off.
      - key: FASHION_API_KEY
        sync: false
      # Paid credits: at most this many calls a day across all users.
      - key: FASHION_API_DAILY_LIMIT
        value: "10"

databases:
  - name: virtualtryon-db
    databaseName: virtualtryon
    user: virtualtryon
    region: frankfurt
    plan: basic-256mb
